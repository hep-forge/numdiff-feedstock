{% set versions = {
    "5.9.0": "87284a117944723eebbf077f857a0a114d818f8b5b54d289d59e73581194f5ef"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set name = environ.get('ANACONDA_PACKAGE', 'numdiff')|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  # conda-forge's own numdiff-feedstock never publishes a linux-aarch64
  # build (CI coverage gap, not a technical one -- pure C, autotools,
  # no arch-specific code); same upstream tarball/hash it uses. Vendored
  # as a release asset on this repo rather than fetched from upstream:
  # both download.savannah.gnu.org and nongnu.askapache.com are mirror
  # redirectors that served GitHub Actions runners a DIFFERENT (wrong
  # sha256) file than direct verification got -- geography-dependent
  # mirror inconsistency, not fixable by picking yet another redirector.
  url: "https://github.com/hep-forge/numdiff-feedstock/releases/download/{{ version }}/numdiff-{{ version }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
  host:
    - gmp
    - gettext
  run:
    - gmp
    - gettext

test:
  commands:
    - numdiff --version
    - test -f ${PREFIX}/bin/numdiff

about:
  home: "https://www.nongnu.org/numdiff/"
  license: "GPL-3.0-or-later"
  summary: "Numeric-aware diff tool for comparing files with small numeric differences"

extra:
  recipe-maintainers:
    - meiyasan
